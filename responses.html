<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b1d28">
    <title>ജപ സമർപ്പണ വിവരങ്ങൾ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-1: #180c10;
            --bg-2: #2a1118;
            --bg-3: #4c1f2d;
            --card: rgba(255, 247, 230, 0.07);
            --border: rgba(255, 216, 136, 0.28);
            --ivory: #fff6ea;
            --gold: #efd8a2;
            --muted: rgba(255, 244, 226, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 16px;
            color: var(--ivory);
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(217,119,6,0.15), transparent 26%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin: 20px 0 26px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(38px, 6vw, 58px);
        }

        .description {
            margin: 10px auto 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .card {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 24px 55px rgba(0,0,0,0.2);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--gold);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: min(100%, 360px);
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--ivory);
            background: rgba(0,0,0,0.2);
            font: inherit;
        }

        input::placeholder {
            color: rgba(255,244,226,0.5);
        }

        button, .back-link {
            display: inline-block;
            padding: 12px 16px;
            border: 1px solid rgba(240,215,158,0.45);
            border-radius: 9px;
            color: #24100f;
            background: var(--gold);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, .back-link:hover {
            background: var(--ivory);
        }

        .back-link {
            margin-top: 18px;
        }

        #status {
            min-height: 24px;
            margin: 8px 0 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 13px 15px;
            border-bottom: 1px solid rgba(255,216,136,0.16);
        }

        th {
            color: var(--gold);
            background: rgba(0,0,0,0.16);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 18px 14px;
            }

            th, td {
                padding: 11px 10px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>ജപ സമർപ്പണ വിവരങ്ങൾ</h1>
            <p class="description">
                ആദ്യത്തെ അഞ്ച് പ്രതികരണങ്ങൾ ഇവിടെ കാണാം. കൂടുതൽ വിവരങ്ങൾ കാണാൻ ഫോൺ നമ്പർ നൽകുക.
            </p>
        </header>

        <section class="card">
            <form class="toolbar" id="search-form">
                <div>
                    <label for="phone">Phone Number</label>
                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="Enter phone number"
                    >
                </div>
                <button type="submit">Search</button>
                <button type="button" id="show-top">Show first 5</button>
            </form>

            <p id="status" role="status" aria-live="polite">Loading responses...</p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Phone Number</th>
                            <th>ആരാണ് ചൊല്ലുന്നത് ?</th>
                            <th>സംഖ്യ</th>
                        </tr>
                    </thead>
                    <tbody id="response-rows"></tbody>
                </table>
            </div>

            <a class="back-link" href="index.html">Back to Home</a>
        </section>
    </main>

    <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMCZULJZ8E3vO_Jc8KEC0Ak0snpjNQ7l_4HSNgNZGf888MWjRJ88r_qBFDguPqmkTU/exec";

    const statusElement = document.getElementById("status");
    const rowsElement = document.getElementById("response-rows");
    const phoneInput = document.getElementById("phone");

    let requestNumber = 0;

    function renderResponses(result) {
        rowsElement.replaceChildren();

        if (!result || !result.success) {
            statusElement.textContent =
                result && result.message
                    ? result.message
                    : "Could not load responses.";
            return;
        }

        if (!Array.isArray(result.data) || result.data.length === 0) {
            statusElement.textContent = "No matching responses found.";
            return;
        }

        result.data.forEach((item) => {
            const row = document.createElement("tr");

            [item.phone, item.name, item.count].forEach((value) => {
                const cell = document.createElement("td");
                cell.textContent = value == null ? "" : String(value);
                row.appendChild(cell);
            });

            rowsElement.appendChild(row);
        });

        statusElement.textContent = result.filtered
            ? `${result.data.length} matching response(s).`
            : "Showing the first five responses.";
    }

    function loadResponses(phone = "") {
        statusElement.textContent = "Loading responses...";
        rowsElement.replaceChildren();

        const callbackName = `handleResponses${++requestNumber}`;
        const params = new URLSearchParams({
            action: "responses",
            callback: callbackName
        });

        if (phone) {
            params.set("phone", phone);
        }

        const script = document.createElement("script");
        let finished = false;

        const cleanup = () => {
            script.remove();
            delete window[callbackName];
        };

        window[callbackName] = (result) => {
            if (finished) return;
            finished = true;
            renderResponses(result);
            cleanup();
        };

        script.onerror = () => {
            if (finished) return;
            finished = true;
            statusElement.textContent =
                "Could not connect to the responses service. Check the Apps Script deployment and access settings.";
            cleanup();
        };

        script.src = `${API_URL}?${params.toString()}`;
        document.body.appendChild(script);

        window.setTimeout(() => {
            if (finished) return;
            finished = true;
            statusElement.textContent =
                "The responses service did not return data. Check that the deployed script supports action=responses.";
            cleanup();
        }, 15000);
    }

    document.getElementById("search-form").addEventListener("submit", (event) => {
        event.preventDefault();

        const phone = phoneInput.value.trim();
        if (!phone) {
            statusElement.textContent = "Enter a phone number to search.";
            phoneInput.focus();
            return;
        }

        loadResponses(phone);
    });

    document.getElementById("show-top").addEventListener("click", () => {
        phoneInput.value = "";
        loadResponses();
    });

    loadResponses();
</script>
</body>
</html>
