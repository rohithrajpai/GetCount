<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b1d28">
    <title>ജപ സമർപ്പണ വിവരങ്ങൾ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #210e14;
            --panel: rgba(255, 247, 230, 0.07);
            --panel-strong: rgba(0, 0, 0, 0.16);
            --border: rgba(255, 216, 136, 0.25);
            --ivory: #fff6ea;
            --gold: #efd8a2;
            --muted: rgba(255, 244, 226, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 36px 18px;
            color: var(--ivory);
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(ellipse at top, rgba(217, 119, 6, 0.13), transparent 38%),
                linear-gradient(145deg, #180c10, #35151f 55%, #4c1f2d);
        }

        main {
            width: min(100%, 960px);
            margin: 0 auto;
        }

        .page-header {
            margin: 12px auto 28px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(38px, 7vw, 62px);
            line-height: 1.1;
        }

        .description {
            max-width: 680px;
            margin: 12px auto 0;
            color: var(--muted);
            line-height: 1.8;
        }

        .card {
            padding: clamp(18px, 4vw, 32px);
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--panel);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
        }

        .section-heading {
            margin: 0 0 14px;
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
        }

        .option-select {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0 0 24px;
            padding: 0;
            border: 0;
        }

        .option-select legend {
            margin-bottom: 12px;
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
        }

        .option-choice {
            display: flex;
            align-items: center;
            gap: 11px;
            min-height: 58px;
            margin: 0;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 13px;
            color: var(--ivory);
            background: var(--panel-strong);
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .option-choice:hover {
            border-color: rgba(239, 216, 162, 0.65);
        }

        .option-choice.selected {
            border-color: var(--gold);
            color: #24100f;
            background: var(--gold);
        }

        .option-choice input {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #7a1e2d;
        }

        .option-choice span {
            line-height: 1.5;
        }

        .search-row {
            display: flex;
            align-items: end;
            gap: 12px;
            padding: 18px;
            border: 1px solid rgba(255, 216, 136, 0.16);
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.12);
        }

        .phone-field {
            flex: 1;
            min-width: 0;
        }

        .phone-field label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-size: 13px;
            font-weight: 700;
        }

        .phone-field input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            color: var(--ivory);
            background: rgba(0, 0, 0, 0.22);
            font: inherit;
        }

        .phone-field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(239, 216, 162, 0.12);
        }

        .phone-field input::placeholder {
            color: rgba(255, 244, 226, 0.48);
        }

        button, .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 11px 18px;
            border: 1px solid rgba(240, 215, 158, 0.45);
            border-radius: 10px;
            color: #24100f;
            background: var(--gold);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover, .back-link:hover {
            background: var(--ivory);
        }

        button:active, .back-link:active {
            transform: translateY(1px);
        }

        button.secondary {
            color: var(--ivory);
            background: transparent;
        }

        button.secondary:hover {
            color: #24100f;
            background: var(--gold);
        }

        .results {
            margin-top: 28px;
        }

        .results-heading {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 12px;
        }

        .results-heading h2 {
            margin: 0;
            font-size: 17px;
        }

        #status {
            min-height: 21px;
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 216, 136, 0.15);
        }

        th {
            color: var(--gold);
            background: rgba(0, 0, 0, 0.15);
            font-size: 14px;
            white-space: nowrap;
        }

        td {
            color: var(--ivory);
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }
		
		.footer{
            margin-top:24px;
            text-align:center;
            color:rgba(255,246,234,0.38);
            font-size:11px;
            letter-spacing:0.2px;
        }

        .page-footer {
            margin-top: 20px;
            text-align: center;
        }

        .back-link {
            min-height: 44px;
            padding: 10px 16px;
        }
		
		.header-logos {
			display: flex;
			justify-content: center;
			align-items: center;
			margin: 0 auto 14px;
		}

		.header-logo-center {
			display: block;
			width: 92px;
			height: 92px;
			object-fit: contain;
			border-radius: 50%;
		}
        @media (max-width: 640px) {
            body {
                padding: 22px 12px;
            }

            .option-select {
                grid-template-columns: 1fr;
            }

            .search-row {
                align-items: stretch;
                flex-direction: column;
            }

            .search-row button {
                width: 100%;
            }

            th, td {
                padding: 12px 10px;
            }

            th {
                font-size: 12px;
            }

            td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
		<div class="header-logos">
				
				<img class="header-logo-center" src="narayana-devar.jpeg" alt="Narayana Devar">
				
			</div>
            <p class="eyebrow">ഓം നമോ നാരായണായ</p>
            <h1>അഷ്ടാക്ഷര, ലക്ഷഗായത്രി ജപയജ്ഞം</h1>
            <h2>കാരണക്കോടം</h2>
            <p class="description">
                കൂടുതൽ വിവരങ്ങൾക്കായി ജപം തിരഞ്ഞെടുക്കുക, ഫോൺ നമ്പർ നൽകി തിരയുക.
            </p>
        </header>

        <section class="card" aria-label="ജപ സമർപ്പണ വിവരങ്ങൾ">
            <form id="search-form">
                <fieldset class="option-select">
                    <legend>Select japam</legend>

                    <label class="option-choice selected">
                        <input type="radio" name="japamType" value="gayathri" checked>
                        <span>ഗായത്രി ജപം (Gayathri Manthra Japam)</span>
                    </label>

                    <label class="option-choice">
                        <input type="radio" name="japamType" value="ashtakshara">
                        <span>അഷ്ടാക്ഷര ജപം (Ashtakashara Japam)</span>
                    </label>
                </fieldset>

                <div class="search-row">
                    <div class="phone-field">
                        <label for="phone">Phone Number</label>
                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            inputmode="tel"
                            autocomplete="tel"
                            placeholder="Enter phone number"
                        >
                    </div>
                    <button type="submit">Search</button>
                    <button type="button" class="secondary" id="show-top">Clear</button>
                </div>
            </form>

            <section class="results" aria-labelledby="results-title">
                <div class="results-heading">
                    <h2 id="results-title">സമർപ്പണ വിവരങ്ങൾ</h2>
                    <p id="status" role="status" aria-live="polite">Loading responses...</p>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Phone Number</th>
                                <th>ആരാണ് ചൊല്ലുന്നത് ?</th>
                                <th>സംഖ്യ</th>
                            </tr>
                        </thead>
                        <tbody id="response-rows"></tbody>
                    </table>
                </div>
            </section>

            <footer class="page-footer">
                <a class="back-link" href="index.html">Back to Home</a>
            </footer>
        </section>
    </main>
	<footer class="footer">
            ॐ नमो नारायणाय
        </footer>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwnvZWAK2_WyXltyTCGoOwIKA2lUQoPc9o0ScsyLHwy0HHAtRBMIM1LIPvm-wNXPG54/exec";

        const statusElement = document.getElementById("status");
        const rowsElement = document.getElementById("response-rows");
        const phoneInput = document.getElementById("phone");

        let requestNumber = 0;
        let selectedType = document.querySelector(
            'input[name="japamType"]:checked'
        ).value;

        function renderResponses(result) {
            rowsElement.replaceChildren();

            if (!result || !result.success) {
                statusElement.textContent =
                    result && result.message
                        ? result.message
                        : "Could not load responses.";
                return;
            }

            if (!Array.isArray(result.data) || result.data.length === 0) {
                statusElement.textContent = "No matching responses found.";
                return;
            }

            result.data.forEach((item) => {
                const row = document.createElement("tr");

                [item.phone, item.name, item.count].forEach((value) => {
                    const cell = document.createElement("td");
                    cell.textContent = value == null ? "" : String(value);
                    row.appendChild(cell);
                });

                rowsElement.appendChild(row);
            });

            statusElement.textContent = result.filtered
                ? `${result.data.length} matching response(s).`
                : "LeaderBoard";
        }

        function loadResponses(phone = "") {
            statusElement.textContent = "Loading responses...";
            rowsElement.replaceChildren();

            const callbackName = `handleResponses${++requestNumber}`;
            const params = new URLSearchParams({
                action: "responses",
                type: selectedType,
                callback: callbackName
            });

            if (phone) {
                params.set("phone", phone);
            }

            const script = document.createElement("script");
            let finished = false;

            const cleanup = () => {
                script.remove();
                delete window[callbackName];
            };

            window[callbackName] = (result) => {
                if (finished) return;
                finished = true;
                renderResponses(result);
                cleanup();
            };

            script.onerror = () => {
                if (finished) return;
                finished = true;
                statusElement.textContent =
                    "Could not connect to the responses service. Check the Apps Script deployment and access settings.";
                cleanup();
            };

            script.src = `${API_URL}?${params.toString()}`;
            document.body.appendChild(script);

            window.setTimeout(() => {
                if (finished) return;
                finished = true;
                statusElement.textContent =
                    "The responses service did not return data. Check the Apps Script deployment and response sheet settings.";
                cleanup();
            }, 15000);
        }

        document.getElementById("search-form").addEventListener("submit", (event) => {
            event.preventDefault();

            const phone = phoneInput.value.trim();
            if (!phone) {
                statusElement.textContent = "Enter a phone number to search.";
                phoneInput.focus();
                return;
            }

            loadResponses(phone);
        });

        document.getElementById("show-top").addEventListener("click", () => {
            phoneInput.value = "";
            loadResponses();
        });

        document.querySelectorAll('input[name="japamType"]').forEach((radio) => {
            radio.addEventListener("change", () => {
                selectedType = radio.value;
                phoneInput.value = "";

                document.querySelectorAll(".option-choice").forEach((choice) => {
                    choice.classList.toggle(
                        "selected",
                        choice.querySelector("input").checked
                    );
                });

                loadResponses();
            });
        });

        loadResponses();
    </script>
</body>
</html>
